apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - datasourceUid: loki
          matcherRegex: "request_id=(\\w+-\\w+-\\w+-\\w+-\\w+)"
          name: RequestID
          url: "$${__value.raw}"