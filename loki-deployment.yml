apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
      
name: loki
      image: grafana/loki:latest
      args:
-config.file=/etc/loki/loki.yaml
    ports:
containerPort: 3100
  volumeMounts:
name: config
  mountPath: /etc/loki
name: data
mountPath: /var/loki
volumes:
name: config
configMap:
  name: loki-config
name: data
emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  type: NodePort
  selector:
    app: loki
  ports:
    
port: 3100
    targetPort: 3100
    nodePort: 31310